<!doctype html>
<html lang="zh-CN">
  <head>

    <link rel="stylesheet" href="./style.css">
    <script src="./config.js?v=2" defer></script>
    <script src="./script.js" defer></script>

  <body>
    <main class="page-shell">
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>
      <section class="gift-card" aria-labelledby="gift-title">
        <div class="gift-topline" aria-hidden="true"><span>✦</span><span class="topline-heart">♡</span><span>✦</span></div>
        <div class="gift-copy">
          <p class="eyebrow">一份小小的心意</p>
          <h1 id="gift-title"><span>花椰菜#11341</span><span>奖励一包鸡脚筋</span></h1>
          <div class="title-underline" aria-hidden="true"></div>
        </div>
        <div class="picture-frame">
          <img src="./IMG_2787.jpg" alt="鸡脚筋礼物配图" width="1320" height="1292" class="gift-image">
          <span class="picture-sparkle sparkle-one" aria-hidden="true">✳</span>
          <span class="picture-sparkle sparkle-two" aria-hidden="true">✳</span>
        </div>
        <form id="address-form" class="address-form" method="post" novalidate>
          <label for="address">收货地址</label>
          <textarea id="address" name="收货地址" placeholder="在这里写下你的收货地址…" maxlength="500" rows="3" autocomplete="street-address" aria-describedby="form-message" required></textarea>
          <button id="submit-address" class="submit-address" type="submit">
            <span class="button-label">收下这包鸡脚筋</span>
            <span class="button-cauliflower" aria-hidden="true">
              <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M14 31c-3-1-6-4-7-8 5 0 9 2 12 6M34 31c3-1 6-4 7-8-5 0-9 2-12 6" fill="#83AB75" stroke="#638E60" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M19 29h10l-2 12h-6l-2-12Z" fill="#94BB7F" stroke="#638E60" stroke-width="1.5" stroke-linejoin="round"/>
                <path d="M13 30a7 7 0 0 1-1-14 9 9 0 0 1 10-9 9 9 0 0 1 11 7 8 8 0 0 1 3 15c-2 4-6 6-11 5-5 2-9 0-12-4Z" fill="#FFF9E9" stroke="#B49272" stroke-width="2" stroke-linejoin="round"/>
                <path d="M12 17c3 0 5 2 6 5m4-15c-1 3 0 5 2 7m9 0c-4 0-6 2-7 5m10 10c-3-2-6-2-8 0m-15 1c2-3 5-4 8-3" stroke="#C9A685" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </span>
          </button>
          <p id="form-message" class="form-message" role="status" aria-live="polite">&nbsp;</p>
          <button id="reset-address" class="reset-address" type="button" hidden>重新填写</button>
        </form>
      </section>
      <div class="page-footer" aria-hidden="true">♡　♡　♡</div>
    </main>
